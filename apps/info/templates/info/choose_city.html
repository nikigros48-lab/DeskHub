{% extends "base.html" %}
{% block title %}Выбор города{% endblock title %}
{% block content %}
    <h2>Города:</h2>
    <form action="{% url "info:select_city" %}" method="post">
        {% csrf_token %}
        {% for city in cities %}
            <input type="submit" name="city" value={{ city.name }}>
        {% endfor %}
        <button type="submit" name="city" value="">Сбросить</button>
    </form>

{% endblock content%}
